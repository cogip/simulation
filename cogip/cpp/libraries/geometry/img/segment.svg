<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 300 175" xmlns="http://www.w3.org/2000/svg">
  <!-- Walking the edges one by one misses a segment that never reaches any of
       them. The separating axis test sees it, because no axis separates it. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="10" fill="#334455">
    <rect x="95" y="45" width="90" height="70" fill="#cfd8e8"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>

    <line x1="60" y1="60" x2="220" y2="60" stroke="#cc3333" stroke-width="2"/>
    <text x="228" y="63" fill="#cc3333">crossing</text>

    <line x1="115" y1="82" x2="165" y2="82" stroke="#cc3333" stroke-width="2"/>
    <text x="228" y="85" fill="#cc3333">entirely inside</text>
    <line x1="168" y1="82" x2="222" y2="82" stroke="#cc3333" stroke-width="0.8"
          stroke-dasharray="2 3"/>

    <line x1="185" y1="115" x2="230" y2="140" stroke="#e0a030" stroke-width="2"/>
    <text x="150" y="152" fill="#e0a030">touching a vertex</text>
    <text x="150" y="165" fill="#667788">contact counts as a hit</text>

    <line x1="60" y1="30" x2="220" y2="30" stroke="#2a8855" stroke-width="2"/>
    <text x="228" y="33" fill="#2a8855">clear</text>
  </g>
</svg>
