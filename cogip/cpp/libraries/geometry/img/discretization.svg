<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 430 200" xmlns="http://www.w3.org/2000/svg">
  <!-- The predicates never approximate the disc. Only the graph nodes are
       sampled, and they have to circumscribe it or the links cut through. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="10" fill="#334455">
    <text x="105" y="20" text-anchor="middle" fill="#667788">nodes on the disc</text>
    <text x="325" y="20" text-anchor="middle" fill="#667788">nodes circumscribed</text>
    <line x1="215" y1="12" x2="215" y2="185" stroke="#c8d0dc" stroke-width="1"
          stroke-dasharray="4 4"/>

    <circle cx="105" cy="95" r="40" fill="#cfd8e8"/>
    <polygon points="145,95 125,60.4 85,60.4 65,95 85,129.6 125,129.6"
             fill="none" stroke="#cc3333" stroke-width="2"/>
    <g fill="#cc3333">
      <circle cx="145" cy="95" r="3.5"/>
      <circle cx="125" cy="60.4" r="3.5"/>
      <circle cx="85" cy="60.4" r="3.5"/>
      <circle cx="65" cy="95" r="3.5"/>
      <circle cx="85" cy="129.6" r="3.5"/>
      <circle cx="125" cy="129.6" r="3.5"/>
    </g>
    <text x="105" y="163" text-anchor="middle" fill="#cc3333">every link cuts the disc</text>
    <text x="105" y="177" text-anchor="middle" fill="#667788">the exact test rejects them all</text>

    <circle cx="325" cy="95" r="40" fill="#cfd8e8"/>
    <polygon points="371.2,95 348.1,55 301.9,55 278.8,95 301.9,135 348.1,135"
             fill="none" stroke="#2a8855" stroke-width="2"/>
    <g fill="#2a8855">
      <circle cx="371.2" cy="95" r="3.5"/>
      <circle cx="348.1" cy="55" r="3.5"/>
      <circle cx="301.9" cy="55" r="3.5"/>
      <circle cx="278.8" cy="95" r="3.5"/>
      <circle cx="301.9" cy="135" r="3.5"/>
      <circle cx="348.1" cy="135" r="3.5"/>
    </g>
    <line x1="325" y1="95" x2="371.2" y2="95" stroke="#334455" stroke-width="1"/>
    <text x="340" y="90" fill="#334455">&#961;</text>
    <text x="325" y="163" text-anchor="middle" fill="#2a8855">links stay tangent</text>
    <text x="325" y="177" text-anchor="middle" fill="#667788">&#961; = r / cos(&#960; / N)</text>
  </g>
</svg>
