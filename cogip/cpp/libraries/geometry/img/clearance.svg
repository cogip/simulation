<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 430 200" xmlns="http://www.w3.org/2000/svg">
  <!-- A vertex placed exactly on the boundary is inside it, and so is the
       endpoint of every link leaving it. The clearance is what buys them out. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="c-tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334455"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="10" fill="#334455">
    <text x="105" y="22" text-anchor="middle" fill="#667788">rescued onto the boundary</text>
    <text x="325" y="22" text-anchor="middle" fill="#667788">rescued past it</text>
    <line x1="215" y1="32" x2="215" y2="188" stroke="#c8d0dc" stroke-width="1"
          stroke-dasharray="4 4"/>

    <rect x="60" y="80" width="50" height="44" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="44" stroke-linejoin="round"/>
    <rect x="60" y="80" width="50" height="44" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="85" cy="102" r="3.5" fill="none" stroke="#cc3333" stroke-width="1.5"/>
    <line x1="90" y1="102" x2="124" y2="102" stroke="#334455" stroke-width="1"
          marker-end="url(#c-tip)"/>
    <g stroke="#cc3333" stroke-width="2">
      <line x1="132" y1="102" x2="185" y2="62"/>
      <line x1="132" y1="102" x2="192" y2="102"/>
      <line x1="132" y1="102" x2="185" y2="142"/>
    </g>
    <circle cx="132" cy="102" r="4.5" fill="#cc3333"/>
    <text x="105" y="170" text-anchor="middle" fill="#cc3333">every link rejected</text>
    <text x="105" y="184" text-anchor="middle" fill="#667788">it touches at its own endpoint</text>

    <rect x="270" y="80" width="50" height="44" fill="#e9eef6"
          stroke="#e9eef6" stroke-width="72" stroke-linejoin="round"/>
    <rect x="270" y="80" width="50" height="44" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="44" stroke-linejoin="round"/>
    <rect x="270" y="80" width="50" height="44" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g stroke="#2a8855" stroke-width="2">
      <line x1="356" y1="102" x2="405" y2="62"/>
      <line x1="356" y1="102" x2="412" y2="102"/>
      <line x1="356" y1="102" x2="405" y2="142"/>
    </g>
    <circle cx="356" cy="102" r="4.5" fill="#2a8855"/>
    <line x1="342" y1="140" x2="356" y2="140" stroke="#334455" stroke-width="1"/>
    <text x="349" y="153" text-anchor="middle" font-size="9">clearance</text>
    <text x="325" y="170" text-anchor="middle" fill="#2a8855">links usable</text>
    <text x="325" y="184" text-anchor="middle" fill="#667788">r + clearance, not r</text>
  </g>
</svg>
