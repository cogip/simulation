<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 430 150" xmlns="http://www.w3.org/2000/svg">
  <!-- A PolygonView carries a vertex count and nothing else. One, two or seven
       vertices are all valid convex sets, so none of them is a special case. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="10" fill="#334455">
    <circle cx="55" cy="67" r="28" fill="#cfd8e8"/>
    <circle cx="55" cy="67" r="3" fill="#334455"/>
    <text x="55" y="118" text-anchor="middle">disc</text>
    <text x="55" y="132" text-anchor="middle" fill="#667788">count 1, r &gt; 0</text>

    <line x1="148" y1="67" x2="188" y2="67" stroke="#cfd8e8" stroke-width="46"
          stroke-linecap="round"/>
    <line x1="148" y1="67" x2="188" y2="67" stroke="#334455" stroke-width="1.5"
          stroke-dasharray="5 4"/>
    <circle cx="148" cy="67" r="3" fill="#334455"/>
    <circle cx="188" cy="67" r="3" fill="#334455"/>
    <text x="168" y="118" text-anchor="middle">capsule</text>
    <text x="168" y="132" text-anchor="middle" fill="#667788">count 2, r &gt; 0</text>

    <polygon points="270,39 293.5,50.3 299.2,75.7 283,96 257,96 240.7,75.7 246.5,50.3"
             fill="#cfd8e8" stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="270" y="118" text-anchor="middle">polygon</text>
    <text x="270" y="132" text-anchor="middle" fill="#667788">count 7, r = 0</text>

    <polygon points="375,45 392.2,53.3 396.5,71.9 384.5,86.8 365.5,86.8 353.5,71.9 357.8,53.3"
             fill="#cfd8e8" stroke="#cfd8e8" stroke-width="24" stroke-linejoin="round"/>
    <polygon points="375,45 392.2,53.3 396.5,71.9 384.5,86.8 365.5,86.8 353.5,71.9 357.8,53.3"
             fill="none" stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="375" y="118" text-anchor="middle">rounded polygon</text>
    <text x="375" y="132" text-anchor="middle" fill="#667788">count 7, r &gt; 0</text>
  </g>
</svg>
