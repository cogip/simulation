<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 430 175" xmlns="http://www.w3.org/2000/svg">
  <!-- The result always lands outside, and always on the outline itself: the
       projection is clamped to each edge rather than to its supporting line. -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334455"/>
    </marker>
    <marker id="tip-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cc3333"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="10" fill="#334455">
    <line x1="145" y1="14" x2="145" y2="140" stroke="#c8d0dc" stroke-width="1"
          stroke-dasharray="4 4"/>
    <line x1="290" y1="14" x2="290" y2="140" stroke="#c8d0dc" stroke-width="1"
          stroke-dasharray="4 4"/>

    <rect x="35" y="60" width="50" height="42" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="34" stroke-linejoin="round"/>
    <rect x="35" y="60" width="50" height="42" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="128" cy="81" r="3.5" fill="#cc3333"/>
    <line x1="128" y1="81" x2="107" y2="81" stroke="#334455" stroke-width="1.2"
          marker-end="url(#tip)"/>
    <circle cx="102" cy="81" r="3.5" fill="#2a8855"/>
    <text x="72" y="150" text-anchor="middle">from outside</text>
    <text x="72" y="163" text-anchor="middle" fill="#667788">pulled onto the boundary</text>

    <rect x="180" y="60" width="50" height="42" fill="#cfd8e8"
          stroke="#cfd8e8" stroke-width="34" stroke-linejoin="round"/>
    <rect x="180" y="60" width="50" height="42" fill="none"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="205" cy="81" r="3.5" fill="#cc3333"/>
    <line x1="205" y1="81" x2="205" y2="114" stroke="#334455" stroke-width="1.2"
          marker-end="url(#tip)"/>
    <circle cx="205" cy="119" r="3.5" fill="#2a8855"/>
    <text x="217" y="150" text-anchor="middle">from inside</text>
    <text x="217" y="163" text-anchor="middle" fill="#667788">pushed back out</text>

    <rect x="320" y="60" width="55" height="42" fill="#cfd8e8"
          stroke="#334455" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="405" cy="35" r="3.5" fill="#cc3333"/>
    <line x1="405" y1="35" x2="382" y2="55" stroke="#334455" stroke-width="1.2"
          marker-end="url(#tip)"/>
    <circle cx="375" cy="60" r="3.5" fill="#2a8855"/>
    <line x1="405" y1="35" x2="405" y2="58" stroke="#cc3333" stroke-width="1"
          stroke-dasharray="3 3" marker-end="url(#tip-red)"/>
    <line x1="375" y1="60" x2="420" y2="60" stroke="#cc3333" stroke-width="0.8"
          stroke-dasharray="2 3"/>
    <text x="360" y="150" text-anchor="middle">facing a vertex</text>
    <text x="360" y="163" text-anchor="middle" fill="#667788">the edge, not its line</text>
  </g>
</svg>
